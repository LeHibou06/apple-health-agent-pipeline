services:
  receiver:
    build: .
    image: apple-health-agent-pipeline:local
    command: ["python", "-m", "app.receiver"]
    restart: unless-stopped
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${RECEIVER_PORT:-8765}:8765"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  normalizer:
    image: apple-health-agent-pipeline:local
    command: ["python", "-m", "app.normalizer"]
    restart: unless-stopped
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    depends_on:
      receiver:
        condition: service_healthy
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  read-api:
    image: apple-health-agent-pipeline:local
    command: ["python", "-m", "app.read_api"]
    restart: unless-stopped
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${READ_API_PORT:-8770}:8770"
    depends_on:
      receiver:
        condition: service_healthy
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
